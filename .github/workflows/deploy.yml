name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # always build the latest content
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=optional --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
